# capa_export_gate - package manifest.
#
# A connector that exports regulated payroll records from an internal
# system to an approved external processing bureau (a SaaS), and checks
# that the regulated data leaves the program through ONE audited
# declassify and that its egress is narrowed to ONE approved host.
#
# The evidence is two independent layers:
#
#   1. FLOW CONFINEMENT (information-flow control). The regulated fields
#      (name, national id, IBAN, gross salary) are @secret. Under
#      @strict_ifc on the egress, a secret-to-sink flow the analysis
#      detects without an audited declassify is a HARD COMPILE ERROR. The
#      single declassify names the DPA with the bureau.
#
#   2. HOST CONFINEMENT (Net attenuation + WASI grant). The egress holds a
#      Net restricted to the approved host, checked at runtime; under
#      --wasi a dynamic URL is refused unless the operator declares the
#      host with --allow-host.
#
# The capability surface is {Net, Fs, Stdio}. The SBOM lists Proc, Db,
# Env, Clock, Random and Unsafe in main's derived exclusion set.
#
# The CSV parsing is inline and holds no capability, so the demo is fully self-contained
# (no dependency fetch is needed for the gate to run). A verified
# capa_csv git dependency, as in capa_dataguard, is the drop-in
# alternative; it is capability-free and would not widen the
# {Net, Fs, Stdio} surface.

[package]
name = "capa_export_gate"
version = "0.1.0"
capa = ">=1.15.1"
